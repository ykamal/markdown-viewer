<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Readme Viewer</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="toolbar">
      <div class="tabs" id="tabs"></div>
      <div class="actions">
        <button class="icon" data-action="open" title="Open file">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
        </button>
        <button class="icon" data-action="toc" title="Table of contents">
          <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" /></svg>
        </button>
        <button class="icon" data-action="find" title="Find">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        </button>
        <button class="icon theme" data-action="theme" title="Appearance">
          <svg class="light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          <svg class="dark" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" /></svg>
        </button>
        <div class="zoom">
          <button class="icon" data-action="zoom-out" title="Zoom out">
            <svg viewBox="0 0 24 24"><path d="M6 12h12" /></svg>
          </button>
          <button class="zoom-level" id="zoom-level" data-action="zoom-reset" title="Reset zoom">100%</button>
          <button class="icon" data-action="zoom-in" title="Zoom in">
            <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12" /></svg>
          </button>
        </div>
      </div>
    </header>
    <div class="content">
      <nav class="toc" id="toc"></nav>
      <div class="docs" id="docs"></div>
      <div class="find" id="find" hidden>
        <input id="find-input" type="text" placeholder="Find in page" spellcheck="false" />
        <span class="find-count" id="find-count"></span>
        <button class="icon" data-action="find-prev" title="Previous">
          <svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6" /></svg>
        </button>
        <button class="icon" data-action="find-next" title="Next">
          <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
        </button>
        <button class="icon" data-action="find-close" title="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <div class="update" id="update" hidden>
        <span id="update-text"></span>
        <button class="primary" data-action="update-install">Restart</button>
        <button class="icon" data-action="update-dismiss" title="Later">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <div class="start" id="start">
        <h1>Readme Viewer</h1>
        <p>Drop a markdown file here, or</p>
        <button data-action="open">Open a file</button>
        <section class="recent" id="recent" hidden>
          <h2>Recent</h2>
          <ul id="recent-list"></ul>
        </section>
      </div>
    </div>
  </body>
</html>

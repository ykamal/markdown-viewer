<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Readme Viewer</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="toolbar" data-tauri-drag-region>
      <div class="group">
        <button class="icon" data-action="toc" title="Toggle contents sidebar">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" /></svg>
        </button>
      </div>
      <div class="tabs" id="tabs" data-tauri-drag-region></div>
      <div class="actions" data-tauri-drag-region>
        <div class="group">
          <button class="icon" data-action="open" title="Open file">
            <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
          </button>
          <button class="icon" data-action="find" title="Find in page">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          </button>
          <button class="icon theme" data-action="theme" title="Appearance">
            <svg class="light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
            <svg class="dark" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" /></svg>
          </button>
        </div>
        <div class="segmented">
          <button class="icon" data-action="zoom-out" title="Zoom out">
            <svg viewBox="0 0 24 24"><path d="M6 12h12" /></svg>
          </button>
          <button class="zoom-level" id="zoom-level" data-action="zoom-reset" title="Reset zoom">100%</button>
          <button class="icon" data-action="zoom-in" title="Zoom in">
            <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12" /></svg>
          </button>
        </div>
      </div>
    </header>
    <div class="content">
      <aside class="sidebar" id="sidebar" hidden>
        <div class="sidebar-header">
          <div class="sidebar-heading">
            <span class="eyebrow">Contents</span>
            <span class="sidebar-title" id="sidebar-title"></span>
          </div>
          <button class="icon" data-action="toc" title="Hide sidebar">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <label class="search-field">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <input id="toc-filter" type="text" placeholder="Filter headings" spellcheck="false" />
        </label>
        <nav class="toc" id="toc"></nav>
        <p class="toc-empty" id="toc-empty" hidden></p>
        <div class="resizer" id="sidebar-resizer" title="Drag to resize"></div>
      </aside>
      <main class="docs" id="docs"></main>
      <div class="find" id="find" hidden>
        <label class="search-field">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <input id="find-input" type="text" placeholder="Find in page" spellcheck="false" />
        </label>
        <span class="find-count" id="find-count"></span>
        <button class="icon" data-action="find-prev" title="Previous">
          <svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6" /></svg>
        </button>
        <button class="icon" data-action="find-next" title="Next">
          <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
        </button>
        <button class="icon" data-action="find-close" title="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <div class="update" id="update" hidden>
        <span id="update-text"></span>
        <button class="button primary" data-action="update-install">Restart</button>
        <button class="icon" data-action="update-dismiss" title="Later">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <div class="viewer" id="viewer" hidden>
        <div class="viewer-stage" id="viewer-stage"></div>
        <div class="viewer-controls">
          <button class="icon" data-action="zoom-out" title="Zoom out">
            <svg viewBox="0 0 24 24"><path d="M6 12h12" /></svg>
          </button>
          <button class="icon" data-action="zoom-in" title="Zoom in">
            <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12" /></svg>
          </button>
          <button class="icon" data-action="viewer-reset" title="Reset">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" /></svg>
          </button>
          <button class="icon" data-action="viewer-close" title="Close (Esc)">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </div>
      </div>
      <div class="start" id="start">
        <div class="welcome">
          <img class="app-icon" src="/src-tauri/icons/128x128@2x.png" alt="" />
          <h1>Readme Viewer</h1>
          <p>Drop a markdown file anywhere in this window, or</p>
          <button class="button primary" data-action="open">Open File… <kbd id="open-shortcut"></kbd></button>
          <section class="recent" id="recent" hidden>
            <h2>Recent</h2>
            <ul id="recent-list"></ul>
          </section>
        </div>
      </div>
      <div class="drop-overlay" id="drop-overlay" hidden>
        <div>Drop to open</div>
      </div>
    </div>
  </body>
</html>
